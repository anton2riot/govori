name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - shell: pwsh
        run: ./tools/check-repository.ps1
      - run: dotnet build src/Govori.Desktop/Govori.Desktop.csproj -c Release --artifacts-path artifacts/dotnet --nologo
